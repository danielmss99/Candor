appId: com.candor.v3
productName: Candor
directories:
  output: release-v3
  buildResources: build
files:
  - dist-v3/electron/**/*
  - dist-v3/renderer/**/*
  - package.json
extraResources:
  - from: build/core-bin
    to: bin
    filter:
      - candor-core
      - candor-core.exe
      - candorctl
      - candorctl.exe
      - candor-mcp
      - candor-mcp.exe
  - from: build/ai-bundle
    to: ai
    filter:
      - "**/*"
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: licenses/MPL-2.0.txt
    to: licenses/MPL-2.0.txt
  - from: LICENSE
    to: LICENSE.txt
asar: true
npmRebuild: false
publish: null
win:
  icon: assets/platform/candor.ico
  target:
    - nsis
mac:
  icon: assets/platform/candor.icns
  target:
    - dmg
  hardenedRuntime: true
  gatekeeperAssess: false
  minimumSystemVersion: "13.0"
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  binaries:
    - Contents/Resources/bin/candor-core
    - Contents/Resources/bin/candorctl
    - Contents/Resources/bin/candor-mcp
  extendInfo:
    NSMicrophoneUsageDescription: Candor records your microphone only when you start a local recording.
    NSScreenCaptureUsageDescription: Candor uses Screen & System Audio Recording permission to capture meeting audio only when you start a local recording. Audio stays on this Mac.
linux:
  icon: build/icons
  category: Office
  syncDesktopName: true
  target:
    - AppImage
    - deb
