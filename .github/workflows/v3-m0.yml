name: Candor v3 M0

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  dependency-audit:
    name: V3 dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust dependency auditor
        run: cargo install cargo-audit --locked

      - name: Audit packaged dependency graphs
        run: npm run v3:dependency-audit

  m0:
    name: M0 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify macOS build SDK
        if: runner.os == 'macOS'
        run: |
          xcodebuild -version
          sdk_major="$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)"
          test "$sdk_major" -ge 26
          echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> "$GITHUB_ENV"

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libasound2-dev \
            libatk-bridge2.0-0 \
            libgbm1 \
            libgtk-3-0 \
            libnss3 \
            libsecret-1-dev \
            libxss1 \
            iproute2 \
            pkg-config \
            util-linux \
            xvfb

      - name: Install frontend dependencies
        run: npm ci

      - name: Run staged v3 verification
        run: npm run v3:verify

      - name: Package M0 release artifacts
        run: npm run electron:v3:dist

      - name: Configure Linux Chromium sandbox for runtime proof
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root release-v3/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release-v3/linux-unpacked/chrome-sandbox
          test "$(stat -c '%u:%g:%a' release-v3/linux-unpacked/chrome-sandbox)" = "0:0:4755"

      - name: Prove packaged application icons
        run: npm run v3:icon-proof

      - name: Smoke release artifact contents
        run: npm run v3:release-artifact-smoke

      - name: Smoke packaged M0 app
        if: runner.os != 'Linux'
        run: npm run m0:packaged-smoke

      - name: Smoke packaged M0 app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run m0:packaged-smoke

      - name: Validate Windows network proof runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: npm run m0:network-deny:windows -- -ValidateOnly

      - name: Run Windows network-deny proof
        if: runner.os == 'Windows'
        shell: pwsh
        run: npm run m0:network-deny:windows

      - name: Validate macOS network proof runner
        if: runner.os == 'macOS'
        run: npm run m0:network-deny:macos -- --validate-only

      - name: Run macOS network-deny proof
        if: runner.os == 'macOS'
        run: sudo env "PATH=$PATH" node scripts/m0-network-deny-macos.mjs --managed-pf

      - name: Validate Linux network proof runner
        if: runner.os == 'Linux'
        run: npm run m0:network-deny:linux -- --validate-only

      - name: Run Linux network-deny proof
        if: runner.os == 'Linux'
        run: sudo env "PATH=$PATH" node scripts/m0-network-deny-linux.mjs

      - name: Write M0 artifact manifest
        if: always()
        run: npm run m0:artifact-manifest

      - name: Write M0 proof audit summary
        if: always()
        run: npm run m0:proof-audit -- --write release-v3/proofs/m0-proof-audit-summary.json

      - name: Upload M0 package and proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candor-v3-m0-${{ matrix.os }}-${{ github.sha }}
          path: release-v3/
          if-no-files-found: error
          retention-days: 14

  m0-proof-audit:
    name: Combined M0 proof audit
    runs-on: ubuntu-latest
    needs: m0
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download M0 package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: candor-v3-m0-*
          path: collected-m0-artifacts

      - name: Audit combined M0 proofs
        run: node scripts/m0-proof-audit.mjs --proof-dir collected-m0-artifacts --write collected-m0-artifacts/m0-combined-proof-audit-summary.json

      - name: Upload combined M0 proof audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candor-v3-m0-combined-proof-audit-${{ github.sha }}
          path: collected-m0-artifacts/m0-combined-proof-audit-summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce strict combined M0 proof audit
        if: always()
        run: node scripts/m0-proof-audit.mjs --proof-dir collected-m0-artifacts --strict
