name: Candor Electron Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  dependency-audit:
    name: V3 dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-06-30
        with:
          toolchain: stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust dependency auditor
        run: cargo install cargo-audit --locked

      - name: Audit packaged dependency graphs
        run: npm run v3:dependency-audit

  m0:
    name: M0 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-06-30
        with:
          toolchain: stable

      - name: Verify macOS build SDK
        if: runner.os == 'macOS'
        run: |
          xcodebuild -version
          sdk_major="$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)"
          test "$sdk_major" -ge 26
          echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> "$GITHUB_ENV"

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            dbus-daemon \
            libasound2-dev \
            libatk-bridge2.0-0 \
            libgbm1 \
            libgtk-3-0 \
            libnss3 \
            libsecret-1-dev \
            libxss1 \
            iproute2 \
            pkg-config \
            util-linux \
            xvfb

      - name: Install frontend dependencies
        run: npm ci

      - name: Run staged v3 verification
        run: npm run v3:verify

      - name: Package M0 release artifacts
        run: npm run electron:v3:dist

      - name: Configure Linux Chromium sandbox for runtime proof
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root release-v3/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release-v3/linux-unpacked/chrome-sandbox
          test "$(stat -c '%u:%g:%a' release-v3/linux-unpacked/chrome-sandbox)" = "0:0:4755"

      - name: Prove packaged application icons
        run: npm run v3:icon-proof

      - name: Smoke release artifact contents
        run: npm run v3:release-artifact-smoke

      - name: Smoke packaged M0 app
        if: runner.os != 'Linux'
        run: npm run m0:packaged-smoke

      - name: Smoke packaged M0 app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run m0:packaged-smoke

      - name: Run Electron integration and accessibility tests
        if: runner.os != 'Linux'
        run: npm run test:electron

      - name: Run Electron integration and accessibility tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:electron

      - name: Validate Windows network proof runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: npm run m0:network-deny:windows -- -ValidateOnly

      - name: Run Windows network-deny proof
        if: runner.os == 'Windows'
        shell: pwsh
        run: npm run m0:network-deny:windows

      - name: Validate macOS network proof runner
        if: runner.os == 'macOS'
        run: npm run m0:network-deny:macos -- --validate-only

      - name: Run macOS network-deny proof
        if: runner.os == 'macOS'
        run: |
          sudo env \
            "PATH=$PATH" \
            "GITHUB_ACTIONS=$GITHUB_ACTIONS" \
            "GITHUB_WORKFLOW=$GITHUB_WORKFLOW" \
            "GITHUB_RUN_ID=$GITHUB_RUN_ID" \
            "GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT" \
            "GITHUB_JOB=$GITHUB_JOB" \
            "GITHUB_SHA=$GITHUB_SHA" \
            "GITHUB_REF=$GITHUB_REF" \
            "RUNNER_OS=$RUNNER_OS" \
            node scripts/m0-network-deny-macos.mjs --managed-pf

      - name: Validate Linux network proof runner
        if: runner.os == 'Linux'
        run: npm run m0:network-deny:linux -- --validate-only

      - name: Run Linux network-deny proof
        if: runner.os == 'Linux'
        run: |
          sudo env \
            "PATH=$PATH" \
            "GITHUB_ACTIONS=$GITHUB_ACTIONS" \
            "GITHUB_WORKFLOW=$GITHUB_WORKFLOW" \
            "GITHUB_RUN_ID=$GITHUB_RUN_ID" \
            "GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT" \
            "GITHUB_JOB=$GITHUB_JOB" \
            "GITHUB_SHA=$GITHUB_SHA" \
            "GITHUB_REF=$GITHUB_REF" \
            "RUNNER_OS=$RUNNER_OS" \
            node scripts/m0-network-deny-linux.mjs

      - name: Write M0 artifact manifest
        if: always()
        run: npm run m0:artifact-manifest

      - name: Write M0 proof audit summary
        if: always()
        run: npm run m0:proof-audit -- --write release-v3/proofs/m0-proof-audit-summary.json

      - name: Upload M0 proof receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: candor-v3-m0-proof-${{ matrix.os }}-${{ github.sha }}
          path: release-v3/proofs/
          if-no-files-found: error
          retention-days: 14

      - name: Upload M0 packages
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: candor-v3-m0-package-${{ matrix.os }}-${{ github.sha }}
          path: |
            release-v3/**
            !release-v3/proofs/**
          if-no-files-found: warn
          retention-days: 14

  m0-proof-audit:
    name: Combined M0 proof audit
    runs-on: ubuntu-latest
    needs: m0
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Download M0 proof receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: candor-v3-m0-proof-*
          path: collected-m0-artifacts

      - name: Audit combined M0 proofs
        run: node scripts/m0-proof-audit.mjs --proof-dir collected-m0-artifacts --write collected-m0-artifacts/m0-combined-proof-audit-summary.json

      - name: Upload combined M0 proof audit
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: candor-v3-m0-combined-proof-audit-${{ github.sha }}
          path: collected-m0-artifacts/m0-combined-proof-audit-summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce strict combined M0 proof audit
        if: always()
        run: node scripts/m0-proof-audit.mjs --proof-dir collected-m0-artifacts --strict
