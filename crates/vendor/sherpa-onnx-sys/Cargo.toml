[package]
name = "sherpa-onnx-sys"
version = "1.13.4"
edition = "2021"
description = "Raw FFI bindings to the sherpa-onnx C API"
license = "Apache-2.0"
repository = "https://github.com/k2-fsa/sherpa-onnx"
links = "sherpa-onnx"
build = "build.rs"

[features]
default = ["static"]
static = []
shared = []

[lib]
name = "sherpa_onnx_sys"
path = "src/lib.rs"

[build-dependencies]
bzip2 = "0.4"
sha2 = "0.10"
tar = "0.4"

[package.metadata.docs.rs]
default-features = false
features = []
