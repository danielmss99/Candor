[package]
name = "candor-core"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "Local-only Rust core for the Candor Electron desktop application."

[dependencies]
base64 = "0.22"
chacha20poly1305 = { version = "0.10.1", features = ["std"] }
cpal = "0.15"
csv = "1.3"
ed25519-dalek = "2.1.1"
fs2 = "0.4.3"
getrandom = "0.2"
krilla = { version = "0.8.2", default-features = false, features = ["simple-text"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
quick-xml = { version = "0.41.0", default-features = false }
rusqlite = { version = "0.40.1", default-features = false, optional = true }
rustybuzz = { version = "0.20.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
sysinfo = "0.39.6"
time = { version = "0.3", default-features = false, features = ["formatting", "std"] }
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
libsqlite3-sys = { version = "0.38.1", optional = true }
whisper-rs = { version = "0.16.0", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
] }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "8.0.0", default-features = false, features = ["macos_13_0"] }

[target.'cfg(not(windows))'.dependencies]
keyring = "4.1.4"

[features]
default = []
local-whisper = ["dep:whisper-rs"]
sqlcipher-vault = [
  "dep:rusqlite",
  "dep:libsqlite3-sys",
  "libsqlite3-sys/bundled-sqlcipher-vendored-openssl",
]

[profile.dev.package.whisper-rs-sys]
opt-level = 3
debug-assertions = false

[profile.dev.package.whisper-rs]
opt-level = 3

[dev-dependencies]
lopdf = { version = "0.44.0", default-features = false }

[profile.release]
strip = true
lto = true
codegen-units = 1
